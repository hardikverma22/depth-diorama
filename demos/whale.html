<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Diorama</title>
<style>
  :root { color-scheme: dark; --ink: #f4efe4; --dim: #a9a597; --bg: #12121a; --panel: #1c1c27; --hot: #ff6a3d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); color: var(--ink); font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 20px; }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .sizes { display: flex; gap: 4px; }
  button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  main { display: grid; place-items: center; min-height: 0; padding: 0 20px; }
  canvas { display: block; max-width: 100%; max-height: 100%; border-radius: 6px; background: #000; }
  footer { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; padding: 14px 20px 18px; }
  #play { min-width: 76px; background: var(--hot); color: #17110d; font-weight: 650; }
  .track { position: relative; }
  #bar { width: 100%; height: 40px; margin: 0; accent-color: var(--hot); cursor: grab; }
  #marks { position: absolute; inset: auto 0 2px; height: 5px; pointer-events: none; }
  #marks i { position: absolute; width: 2px; height: 5px; background: var(--dim); }
  .hint { grid-column: 2; margin: -6px 0 0; color: var(--dim); font-size: 13px; }
  #error { position: fixed; inset: auto 20px 20px; padding: 14px 16px; background: #5b1d1d; border-radius: 8px; }
  @media (max-width: 560px) { header { flex-wrap: wrap; padding: 12px; } main { padding: 0 12px; } footer { padding: 12px; } }
</style>
<header>
  <h1 id="title">Depth Diorama</h1>
  <div class="sizes" role="group" aria-label="Frame shape">
    <button data-aspect="16:9">16:9</button><button data-aspect="9:16">9:16</button><button data-aspect="1:1">1:1</button>
  </div>
</header>
<main><canvas id="view" role="img" aria-label="An illustrated scene that looks flat, then opens into deep 3D"></canvas></main>
<footer>
  <button id="play">Pause</button>
  <div class="track"><input id="bar" type="range" min="0" max="10" value="0" aria-label="Position in the loop"><div id="marks"></div></div>
  <p class="hint">Drag the bar slowly. Tick marks show where the picture is flat.</p>
</footer>
<div id="error" role="alert" hidden></div>
