<!doctype html>
<meta charset="utf-8">
<title>Depth Diorama</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<canvas id="gl"></canvas>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<script type="module">
  const q = new URLSearchParams(location.search);
  const fail = (e) => { window.DR_ERROR = { name: e?.name ?? "Error", message: e?.message ?? String(e), stack: e?.stack ?? "" }; };
  window.addEventListener("error", (ev) => fail(ev.error ?? new Error(ev.message)));
  window.addEventListener("unhandledrejection", (ev) => fail(ev.reason));
  try {
    const { boot } = await import("./stage.js");
    const mod = await import(q.get("scene"));
    const width = +q.get("w"), height = +q.get("h"), canvas = document.getElementById("gl");
    canvas.width = width; canvas.height = height; canvas.style.width = `${width}px`; canvas.style.height = `${height}px`;
    window.DR = boot(mod.default, { canvas, width, height, quality: q.get("quality") ?? "final", look: q.get("look") || undefined, choreography: q.get("choreo") || undefined, duration: q.get("duration") ? +q.get("duration") : undefined });
    window.DR.frame(0, 30, 1);
    window.DR_READY = true;
  } catch (e) { fail(e); }
</script>
