<!doctype html>
<meta charset="utf-8">
<title>Depth Diorama: picture</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<canvas id="gl"></canvas>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js" } }</script>
<script type="module">
  const fail = (e) => { window.DR_ERROR = { name: e?.name ?? "Error", message: e?.message ?? String(e), stack: e?.stack ?? "" }; };
  window.addEventListener("error", (ev) => fail(ev.error ?? new Error(ev.message)));
  window.addEventListener("unhandledrejection", (ev) => fail(ev.reason));
  try {
    const { boot } = await import("./film.js");
    const cfg = await (await fetch("/config/config.json")).json();
    const canvas = document.getElementById("gl");
    canvas.width = cfg.w; canvas.height = cfg.h; canvas.style.width = `${cfg.w}px`; canvas.style.height = `${cfg.h}px`;
    window.DR = await boot(cfg, canvas);
    window.DR.frame(0, 30, 1);
    window.DR_READY = true;
  } catch (e) { fail(e); }
</script>
